name: AuraBR iOS · build e testes
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      macos_runner:
        description: "Runner macOS (altere para contornar filas)"
        type: choice
        default: macos-15-intel
        options:
          - macos-15-intel
          - macos-15
          - macos-26
concurrency:
  group: aurabr-ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  swift-core:
    name: Testes de temas e sugestões offline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift Package tests
        run: swift test --parallel
      - name: Conferir configuração do teclado e privacidade
        run: |
          python3 - <<'PY'
          import plistlib
          p = plistlib.load(open('KeyboardExtension/Info.plist', 'rb'))
          ext = p['NSExtension']
          assert ext['NSExtensionPointIdentifier'] == 'com.apple.keyboard-service'
          assert ext['NSExtensionAttributes']['RequestsOpenAccess'] is False
          assert ext['NSExtensionAttributes']['PrimaryLanguage'] == 'pt-BR'
          print('Teclado iOS offline e sem Full Access: configuração válida')
          PY
      - name: Verificar artes de frutas aprovadas no Android
        run: python3 scripts/validate_fruit_assets.py
  simulator-build:
    name: Compilar app + extensão para simulador
    runs-on: ${{ inputs.macos_runner || 'macos-15-intel' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Diagnosticar macOS e Xcode
        run: xcodebuild -version && uname -m
      - name: Instalar XcodeGen
        run: brew install xcodegen
      - name: Gerar projeto Xcode
        run: xcodegen generate
      - name: Compilar todos os targets sem assinatura
        run: |
          set -o pipefail
          xcodebuild -project AuraBRiOS.xcodeproj -scheme AuraBR -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/AuraBRDerivedData" \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tee xcodebuild.log
      - name: Testar o bundle resultante
        run: |
          APP="$RUNNER_TEMP/AuraBRDerivedData/Build/Products/Debug-iphonesimulator/AuraBR.app"
          test -d "$APP"
          test -d "$APP/PlugIns/AuraBRKeyboard.appex"
          grep -q 'BUILD SUCCEEDED' xcodebuild.log
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/AuraBR-iOS-simulator.zip"
          echo 'App e extensao do simulador validados. Não é IPA para iPhone físico.'
      - name: Publicar pacote de simulador
        uses: actions/upload-artifact@v4
        with:
          name: AuraBR-iOS-simulator
          path: ${{ runner.temp }}/AuraBR-iOS-simulator.zip
          retention-days: 7
