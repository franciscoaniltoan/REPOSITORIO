name: AuraBRiOS
options:
  minimumXcodeGenVersion: 2.41.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  AuraBR:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Sources/AuraBRCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aurabr.ios
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/AuraBR.entitlements
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        # App Store icon is not yet approved; avoid Xcode's implicit AppIcon lookup.
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - target: AuraBRKeyboard
        embed: true
        link: false
  AuraBRKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: KeyboardExtension
      - path: Sources/AuraBRCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aurabr.ios.keyboard
        INFOPLIST_FILE: KeyboardExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: KeyboardExtension/AuraKeyboard.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
